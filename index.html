<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <title>同泽管理下载</title>
  <link rel="icon" href="ic_launcher.png">
  <link rel="apple-touch-icon" href="ic_launcher.png">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --primary-soft: #EEF2FF;
      --primary-line: rgba(79, 70, 229, 0.18);
      --bg: #FFFFFF;
      --bg-soft: #F8FAFC;
      --text: #111827;
      --muted: #64748B;
      --line: #E2E8F0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(238, 242, 255, 0.92) 0%, rgba(255, 255, 255, 0.98) 34%, #FFFFFF 100%),
        repeating-linear-gradient(90deg, rgba(79, 70, 229, 0.04) 0 1px, transparent 1px 72px);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 920px);
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top) + 32px)
        22px
        calc(env(safe-area-inset-bottom) + 36px);
    }

    .shell {
      display: grid;
      gap: 22px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
      min-height: min(660px, calc(100vh - 68px));
      padding: clamp(26px, 5vw, 52px) 0;
      overflow: hidden;
    }

    .hero-content {
      min-width: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--primary-line);
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hero h1 {
      margin: 20px 0 0;
      color: var(--text);
      font-size: clamp(50px, 10vw, 104px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 520px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 24px);
      line-height: 1.5;
      font-weight: 500;
    }

    .brand-card {
      display: grid;
      justify-items: center;
      gap: 18px;
      width: clamp(190px, 34vw, 310px);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #FFFFFF;
      box-shadow: 0 20px 44px rgba(79, 70, 229, 0.16);
    }

    .brand-mark {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 16px 34px rgba(79, 70, 229, 0.22);
    }

    .brand-name {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-dark);
      font-size: 20px;
      font-weight: 800;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 560px;
      margin-top: 32px;
    }

    .button {
      min-width: 0;
      min-height: 66px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 18px;
      border-radius: 18px;
      border: 1px solid transparent;
      background: var(--primary);
      color: #FFFFFF;
      text-decoration: none;
      font-size: clamp(16px, 2.6vw, 20px);
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: 0 16px 30px rgba(79, 70, 229, 0.24);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .button.secondary {
      border-color: var(--primary-line);
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: none;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(79, 70, 229, 0.28);
    }

    .button.secondary:hover {
      background: var(--primary-soft);
      box-shadow: none;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
    }

    .button.secondary .button-icon {
      background: var(--primary-soft);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .info-card {
      min-height: 132px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #FFFFFF;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.06);
    }

    .info-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 17px;
      line-height: 1.35;
    }

    .info-card span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border: 1px solid var(--primary-line);
      border-radius: var(--radius);
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .notice strong {
      flex: 0 0 auto;
      font-size: 16px;
    }

    .notice span {
      color: #4338CA;
      font-size: 14px;
      line-height: 1.7;
      text-align: right;
    }

    .wechat-mask {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      padding: 22px;
      background: rgba(15, 23, 42, 0.68);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
    }

    .wechat-mask.show {
      display: flex;
    }

    .wechat-panel {
      width: min(100%, 420px);
      padding: 24px 22px;
      border-radius: var(--radius);
      background: #FFFFFF;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.2);
    }

    .wechat-panel h2 {
      margin: 0 0 12px;
      color: var(--text);
      font-size: 24px;
      line-height: 1.2;
    }

    .wechat-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .wechat-note {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 14px;
      line-height: 1.75;
    }

    .wechat-close {
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: var(--radius);
      background: var(--primary);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: 0;
        text-align: center;
      }

      .hero p {
        margin-left: auto;
        margin-right: auto;
      }

      .brand-card {
        width: min(72vw, 260px);
        margin: 0 auto;
        order: -1;
      }

      .actions {
        margin-left: auto;
        margin-right: auto;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .notice {
        display: grid;
        justify-items: start;
      }

      .notice span {
        text-align: left;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .hero {
        padding: 24px 18px;
      }

      .hero h1 {
        font-size: 52px;
      }

      .hero p {
        font-size: 16px;
      }

      .actions {
        grid-template-columns: 1fr;
        width: 100%;
        gap: 12px;
      }

      .button {
        min-height: 58px;
        border-radius: 16px;
        font-size: 16px;
      }

      .brand-card {
        width: min(74vw, 228px);
        padding: 14px;
      }

      .brand-mark {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <section class="hero">
        <div class="hero-content">
          <span class="eyebrow">亦畅能源</span>
          <h1>同泽管理</h1>
          <p>让管理更轻巧直接，支持 Android 与 iOS 快速下载安装。</p>

          <div class="actions" aria-label="下载 同泽管理">
            <a class="button" href="app-release.apk" download>
              <span class="button-icon">A</span>
              <span>安卓下载</span>
            </a>
            <a class="button secondary" href="同泽管理.mobileconfig" download>
              <span class="button-icon">i</span>
              <span>苹果下载</span>
            </a>
          </div>
        </div>

        <div class="brand-card" aria-label="NAD+ 应用图标">
          <img class="brand-mark" src="ic_launcher.png" alt="NAD+ 图标">
          <div class="brand-name">同泽管理</div>
        </div>
      </section>

      <section class="info-grid" aria-label="安装说明">
        <div class="info-card">
          <strong>Android 安装</strong>
          <span>点击安卓下载后，按系统提示完成安装。如提示风险，请确认来源后继续。</span>
        </div>
        <div class="info-card">
          <strong>iOS 安装</strong>
          <span>下载描述文件后，进入设置完成安装，并在设备管理中信任证书。</span>
        </div>
        <div class="info-card">
          <strong>浏览器打开</strong>
          <span>微信内可能无法直接下载，请使用系统浏览器重新打开本页面。</span>
        </div>
      </section>

      <div class="notice">
        <strong>安装提示</strong>
        <span>建议在网络稳定时下载，安装完成后回到桌面打开 NAD+。</span>
      </div>
    </div>
  </main>

  <div class="wechat-mask" id="wechatMask">
    <div class="wechat-panel">
      <h2>请在浏览器中打开</h2>
      <p>检测到你当前在微信内打开，微信内可能无法正常下载安装包。</p>
      <div class="wechat-note">
        点击右上角菜单，然后选择“在浏览器打开”后，再进行下载安装。
      </div>
      <button class="wechat-close" type="button" id="wechatClose">我知道了</button>
    </div>
  </div>

  <script>
    (function () {
      var ua = window.navigator.userAgent.toLowerCase();
      var isWeChat = /micromessenger/.test(ua);
      var mask = document.getElementById("wechatMask");
      var closeButton = document.getElementById("wechatClose");

      if (isWeChat && mask) {
        mask.classList.add("show");
      }

      if (closeButton && mask) {
        closeButton.addEventListener("click", function () {
          mask.classList.remove("show");
        });
      }
    })();
  </script>
</body>
</html>
